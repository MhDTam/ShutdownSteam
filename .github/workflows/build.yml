name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: |
          .\build.ps1
          .\test.ps1
      - name: Package
        shell: powershell
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $version = $env:GITHUB_REF_NAME.TrimStart('v') }
          .\package.ps1 -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: ShutdownSteam-Windows-Portable
          path: |
            release/*.zip
            release/SHA256SUMS.txt
            portable/ShutdownSteam.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ShutdownSteam-Windows-Portable
          path: artifacts
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/release/*.zip artifacts/release/SHA256SUMS.txt artifacts/portable/ShutdownSteam.exe --title "ShutdownSteam $GITHUB_REF_NAME" --generate-notes --verify-tag
